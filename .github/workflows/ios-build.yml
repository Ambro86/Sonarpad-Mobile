name: Sonarpad iOS Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build Sonarpad iOS App
    runs-on: macos-latest

    env:
      APP_NAME: Sonarpad

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test --exclude-tags golden

      - name: Ensure iOS project exists
        run: |
          if [ ! -d "ios/Runner.xcodeproj" ]; then
            flutter create --platforms=ios --project-name sonarpad .
          fi

      - name: Set iOS app name
        run: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ${APP_NAME}" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ${APP_NAME}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName ${APP_NAME}" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string ${APP_NAME}" "$PLIST"

      - name: Configure iOS permissions for file_picker
        run: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Richiesto per allegare o leggere documenti salvati tra le foto." "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :LSSupportsOpeningDocumentsInPlace true" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Set :UIFileSharingEnabled true" "$PLIST"

      - name: Configure iOS background audio mode
        run: |
          PLIST="ios/Runner/Info.plist"
          # Aggiunge UIBackgroundModes con audio se non esiste già
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST" 2>/dev/null || true
          echo "UIBackgroundModes configurato:"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$PLIST"

      - name: Enable Background Modes capability in Xcode project
        run: |
          gem install xcodeproj --no-document --quiet
          ruby - <<'RUBY'
          require 'xcodeproj'
          project_path = Dir.glob('ios/*.xcodeproj').first
          abort 'Progetto Xcode non trovato' unless project_path
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'Runner' }
          abort 'Target Runner non trovato' unless target
          # Aggiunge la system capability BackgroundModes se non presente
          unless target.build_configurations.all? { |c|
            c.build_settings['INFOPLIST_KEY_UIBackgroundModes']&.include?('audio')
          }
            target.build_configurations.each do |config|
              existing = config.build_settings['INFOPLIST_KEY_UIBackgroundModes'] || []
              existing = [existing] if existing.is_a?(String)
              config.build_settings['INFOPLIST_KEY_UIBackgroundModes'] = (existing + ['audio']).uniq
            end
          end
          project.save
          puts 'Background Modes audio abilitato nel progetto Xcode'
          RUBY

      - name: Install CocoaPods dependencies
        run: |
          if [ -f "ios/Podfile" ]; then
            cd ios
            pod install --repo-update
          fi

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        run: |
          mkdir -p build/ipa/Payload

          APP_PATH=$(find "build/ios/iphoneos" -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app file found in build/ios/iphoneos"
            exit 1
          fi

          cp -R "$APP_PATH" "build/ipa/Payload/${APP_NAME}.app"
          cd build/ipa
          zip -qry "${APP_NAME}.ipa" Payload
          ls -la "${APP_NAME}.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Sonarpad-ios-unsigned
          path: build/ipa/Sonarpad.ipa
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sonarpad-ios-build-logs
          path: |
            build/
            ios/Pods/
            ios/Flutter/
          retention-days: 7
