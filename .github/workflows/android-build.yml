name: Sonarpad Android APK Build

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Sonarpad Android APK
    runs-on: ubuntu-latest

    env:
      APP_NAME: Sonarpad
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android project exists
        run: |
          if [ ! -d "android/app" ]; then
            flutter create --platforms=android --project-name sonarpad .
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test --exclude-tags golden --dart-define=SONARPAD_ROUTE_CLIENT_TOKEN=${{ secrets.SONARPAD_ROUTE_CLIENT_TOKEN }}

      - name: Configure Android project
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          app_name = os.environ.get("APP_NAME", "Sonarpad")
          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if manifest.exists():
              text = manifest.read_text(encoding="utf-8")

              # Internet è necessario per TTS, RSS, podcast, aggiornamenti, mappe e API.
              if "android.permission.INTERNET" not in text:
                  text = text.replace(
                      ">",
                      ">\n    <uses-permission android:name=\"android.permission.INTERNET\" />",
                      1,
                  )

              # Permessi per just_audio_background
              if "android.permission.WAKE_LOCK" not in text:
                  text = text.replace(
                      "<application",
                      "    <uses-permission android:name=\"android.permission.WAKE_LOCK\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />\n    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK\" />\n    <application",
                      1,
                  )

              # Servizi e receiver per just_audio_background
              if "com.ryanheise.audioservice.AudioService" not in text:
                  text = text.replace(
                      "</activity>",
                      "</activity>\n        <service android:name=\"com.ryanheise.audioservice.AudioService\" android:foregroundServiceType=\"mediaPlayback\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.media.browse.MediaBrowserService\" />\n            </intent-filter>\n        </service>\n        <receiver android:name=\"com.ryanheise.audioservice.MediaButtonReceiver\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MEDIA_BUTTON\" />\n            </intent-filter>\n        </receiver>",
                      1,
                  )

              # Imposta AudioServiceActivity come main activity per just_audio_background
              if "android:name=\".MainActivity\"" in text:
                  text = text.replace("android:name=\".MainActivity\"", "android:name=\"com.ryanheise.audioservice.AudioServiceActivity\"")

              # Mantiene il nome dell'app coerente con iOS.
              if "android:label=" in text:
                  text = re.sub(r'android:label="[^"]*"', f'android:label="{app_name}"', text, count=1)

              manifest.write_text(text, encoding="utf-8")
              print("AndroidManifest.xml configurato")
          else:
              print("AndroidManifest.xml non trovato")

          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              gradle = Path("android/app/build.gradle")
          
          if gradle.exists():
              gradle_text = gradle.read_text(encoding="utf-8")
              gradle_text = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', gradle_text)
              gradle_text = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', gradle_text)
              gradle_text = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', gradle_text)
              gradle_text = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', gradle_text)
              gradle.write_text(gradle_text, encoding="utf-8")
              print("build.gradle configurato (compileSdk=36)")
          PY

      - name: Force compileSdk 36 in plugins
        run: |
          find ~/.pub-cache/hosted/pub.dev -name "build.gradle*" -exec sed -i -E 's/compileSdk\s*=?\s*([0-9]+|flutter\.compileSdkVersion)/compileSdk = 36/g' {} + || true
          find ~/.pub-cache/hosted/pub.dev -name "build.gradle*" -exec sed -i -E 's/compileSdkVersion\s*=?\s*([0-9]+|flutter\.compileSdkVersion)/compileSdkVersion 36/g' {} + || true

      - name: Run Integration Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel
          disk-size: 2048M
          force-avd-creation: false
          script: flutter test integration_test/app_test.dart

      - name: Fix Proguard rules for ML Kit
        run: |
          mkdir -p android/app
          echo "-keep class com.google.mlkit.vision.text.** { *; }" > android/app/proguard-rules.pro
          echo "-dontwarn com.google.mlkit.vision.text.**" >> android/app/proguard-rules.pro

      - name: Build release APK
        run: flutter build apk --release --dart-define=SONARPAD_ROUTE_CLIENT_TOKEN=${{ secrets.SONARPAD_ROUTE_CLIENT_TOKEN }}

      - name: Sign APK with release keystore
        id: sign_app
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != ''
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: build/app/outputs/flutter-apk
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare signed APK artifact
        if: env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != ''
        run: |
          mkdir -p build/release
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" "build/release/${APP_NAME}-android.apk"
          ls -la build/release

      - name: Prepare unsigned/debug-signed APK artifact
        if: env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEYSTORE_PASSWORD == '' || env.ANDROID_KEY_PASSWORD == ''
        run: |
          mkdir -p build/release
          cp "build/app/outputs/flutter-apk/app-release.apk" "build/release/${APP_NAME}-android.apk"
          ls -la build/release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonarpad-android-apk
          path: build/release/Sonarpad-android.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/Sonarpad-android.apk
          fail_on_unmatched_files: true

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Sonarpad-android-build-logs
          path: |
            build/
            android/.gradle/
            android/app/build/
          retention-days: 7
