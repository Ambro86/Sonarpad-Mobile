name: Screenshots Generator

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate raw screenshots
        run: >
          flutter test test/screenshots_test.dart
          --update-goldens
          --dart-define=SONARPAD_ROUTE_CLIENT_TOKEN=${{ secrets.SONARPAD_ROUTE_CLIENT_TOKEN }}

      - name: Prepare App Store screenshots
        if: success()
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          source = Path('test/goldens')
          target = Path('app_store_screenshots')
          target.mkdir(exist_ok=True)

          wanted = [
              '01_home_screen.png',
              '02_settings_screen.png',
              '03_documents_screen.png',
              '04_wikipedia_screen.png',
              '05_news_screen.png',
              '06_podcast_screen.png',
              '07_radio_screen.png',
              '08_route_screen.png',
          ]

          missing = []
          for name in wanted:
              matches = list(source.rglob(name))
              if not matches:
                  missing.append(name)
                  continue
              img = Image.open(matches[0]).convert('RGB')
              # iPhone 6.5-inch App Store screenshot size.
              canvas_size = (1242, 2688)
              img = ImageOps.contain(img, canvas_size)
              canvas = Image.new('RGB', canvas_size, 'white')
              x = (canvas_size[0] - img.width) // 2
              y = (canvas_size[1] - img.height) // 2
              canvas.paste(img, (x, y))
              canvas.save(target / name, quality=95)

          if missing:
              raise SystemExit('Screenshot mancanti: ' + ', '.join(missing))
          PY

      - name: Upload App Store screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sonarpad-app-store-screenshots
          if-no-files-found: error
          path: app_store_screenshots/

      - name: Upload raw diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarpad-raw-screenshot-diagnostics
          if-no-files-found: warn
          path: |
            test/goldens/
            test/failures/
