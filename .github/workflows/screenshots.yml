name: Screenshots Generator

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate raw iPhone screenshots
        run: >
          flutter test test/screenshots_test.dart
          --update-goldens
          --dart-define=SONARPAD_SCREENSHOT_DEVICE=iphone
          --dart-define=SONARPAD_ROUTE_CLIENT_TOKEN=${{ secrets.SONARPAD_ROUTE_CLIENT_TOKEN }}

      - name: Save raw iPhone screenshots
        if: success()
        shell: bash
        run: |
          mkdir -p raw_screenshots/iphone
          find test/goldens -name '*.png' -exec cp {} raw_screenshots/iphone/ \;
          rm -rf test/goldens test/failures

      - name: Generate raw iPad screenshots
        run: >
          flutter test test/screenshots_test.dart
          --update-goldens
          --dart-define=SONARPAD_SCREENSHOT_DEVICE=ipad
          --dart-define=SONARPAD_ROUTE_CLIENT_TOKEN=${{ secrets.SONARPAD_ROUTE_CLIENT_TOKEN }}

      - name: Save raw iPad screenshots
        if: success()
        shell: bash
        run: |
          mkdir -p raw_screenshots/ipad
          find test/goldens -name '*.png' -exec cp {} raw_screenshots/ipad/ \;

      - name: Prepare App Store screenshots
        if: success()
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          wanted = [
              '01_home_screen.png',
              '02_settings_screen.png',
              '03_documents_screen.png',
              '04_wikipedia_screen.png',
              '05_news_screen.png',
              '06_podcast_screen.png',
              '07_radio_screen.png',
              '08_route_screen.png',
          ]

          jobs = [
              ('iphone', Path('raw_screenshots/iphone'), Path('app_store_screenshots/iphone_6_5'), (1242, 2688)),
              # iPad 12.9/13-inch accepted App Store size, portrait.
              ('ipad', Path('raw_screenshots/ipad'), Path('app_store_screenshots/ipad_13'), (2048, 2732)),
          ]

          for label, source, target, canvas_size in jobs:
              target.mkdir(parents=True, exist_ok=True)
              missing = []
              for name in wanted:
                  path = source / name
                  if not path.exists():
                      missing.append(name)
                      continue
                  img = Image.open(path).convert('RGB')
                  img = ImageOps.contain(img, canvas_size)
                  canvas = Image.new('RGB', canvas_size, 'white')
                  x = (canvas_size[0] - img.width) // 2
                  y = (canvas_size[1] - img.height) // 2
                  canvas.paste(img, (x, y))
                  canvas.save(target / name, quality=95)
              if missing:
                  raise SystemExit(f'Screenshot mancanti per {label}: ' + ', '.join(missing))
          PY

      - name: Upload App Store screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sonarpad-app-store-screenshots-iphone-ipad
          if-no-files-found: error
          path: app_store_screenshots/

      - name: Upload raw diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarpad-raw-screenshot-diagnostics
          if-no-files-found: warn
          path: |
            raw_screenshots/
            test/goldens/
            test/failures/
