name: sonarpad_mobile_starter
description: Starter accessibile Flutter per Sonarpad iPhone con notizie, podcast, Wikipedia ed Edge TTS Rust.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  xml: ^6.5.0
  html: ^0.15.4
  intl: ^0.19.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0
  just_audio: ^0.9.39
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  ffi: ^2.1.3
  path: ^1.9.0
  just_audio_windows: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
