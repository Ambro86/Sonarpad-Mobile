name: sonarpad_mobile_starter
description: Starter accessibile Flutter per Sonarpad iPhone con notizie, podcast, Wikipedia ed Edge TTS Rust.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  rhttp_plus: ^0.11.7
  xml: ^6.5.0
  html: ^0.15.4
  intl: ^0.20.2
  url_launcher: ^6.3.0
  webview_flutter: ^4.8.0
  just_audio: ^0.10.5
  audio_session: ^0.2.3
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  ffi: ^2.1.3
  path: ^1.9.0
  just_audio_windows: ^0.2.3
  reader_mode: 0.2.2
  file_picker: ^8.1.4
  syncfusion_flutter_pdf: ^33.2.7
  archive: ^3.6.1
  epubx: ^4.0.0
  uuid: ^4.5.3
  crypto: ^3.0.7
  wakelock_plus: ^1.2.10
  app_links: 7.0.0
  just_audio_background: ^0.0.1-beta.17
  share_plus: ^12.0.2
  flutter_tts: ^4.2.5
  package_info_plus: ^9.0.1
  scroll_to_index: ^3.0.1
  camera: ^0.12.0+1
  google_mlkit_text_recognition: ^0.15.1
  string_similarity: ^2.0.0
  permission_handler: ^12.0.1
  google_mlkit_barcode_scanning: ^0.14.2
  sqflite: ^2.4.2+1
  pdfx: ^2.9.2
  google_mlkit_object_detection: ^0.15.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  golden_toolkit: ^0.15.0
  sqflite_common_ffi: ^2.4.0+3

flutter:
  uses-material-design: true

  assets:
    - assets/aifa_cache_seed.db
    - assets/data/edge_voices.json
    - assets/images/
