name: unrar
description: A Dart FFI package for extracting RAR archives using the official UnRAR library from RARLab.
version: 0.2.0
repository: https://github.com/maistho/dart_unrar

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  ffi: ^2.2.0
  code_assets: ^1.2.0
  hooks: ^2.0.2
  logging: ^1.3.0
  native_toolchain_c: ^0.19.1

dev_dependencies:
  ffigen: ^23.0.0
  lints: ^6.1.0
  path: ^1.9.1
  test: ^1.33.0

